name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # ← to jest kluczowe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: make

      - uses: softprops/action-gh-release@v2
        with:
          files: my_binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}