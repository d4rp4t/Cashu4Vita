name: Build VPK & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gnuton/vitasdk-docker:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mbedtls
        run: vdpm mbedtls

      - name: Patch bc-ur (missing cstring include)
        run: |
          sed -i '/#include <limits>/a #include <cstring>' deps/bc-ur/src/xoshiro256.cpp

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        run: cmake --build build -j$(nproc)

      - name: Upload VPK
        uses: softprops/action-gh-release@v2
        with:
          files: build/Cashu4Vita.vpk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
